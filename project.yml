name: Narabu
options:
  bundleIdPrefix: io.github.supamucho76wq
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: ja
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Narabu:
    type: application
    platform: iOS
    sources:
      - path: Narabu
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.supamucho76wq.narabu
        PRODUCT_NAME: Narabu
        INFOPLIST_FILE: Narabu/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: targeted
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - NarabuTests
  NarabuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NarabuTests
    dependencies:
      - target: Narabu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.supamucho76wq.narabu.tests
        GENERATE_INFOPLIST_FILE: true
